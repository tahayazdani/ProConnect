name: Build and Test

# Runs on every push to every branch, plus every PR targeting main, so a broken build or a failing
# test is caught on the very next commit rather than only being discovered manually or at merge time.
# Previously scoped to push-to-main-only on the theory that a PR's own CI run covers feature branches -
# but this repo's actual workflow is direct pushes to a working branch (develop today) without opening
# a PR first, so that assumption didn't hold: a push-to-main-only trigger meant CI never ran at all
# until something eventually got merged to main. No `branches:` filter on `push` below is deliberate -
# every push to every branch runs this.
on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to 8.0.x (not just "8.0") so a floating patch bump in the runner image can't silently
      # change the SDK version CI builds against - matches the net8.0 TargetFramework used by every
      # project in the solution (see ProConnect.Tests/ProConnect.Tests.csproj etc.).
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ProConnect.sln

      # --no-restore: restore already happened above as its own step, so a build failure here is
      # unambiguously a compile error rather than a transient restore/network issue.
      - name: Build
        run: dotnet build ProConnect.sln --no-restore --configuration Release

      # ProConnect.Tests (xUnit + Moq) is pure unit tests against mocked IUserRepository /
      # IRefreshTokenRepository / ITokenService collaborators (see UserServiceTests.cs,
      # TokenServiceTests.cs, RefreshTokenRequestValidatorTests.cs) - no real Postgres/Redis
      # connection is required, so this step needs no service containers or connection strings.
      - name: Test
        run: dotnet test ProConnect.sln --no-build --configuration Release --verbosity normal
